  <path d="M 50 54 Q 20 66 18 78" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 50 58 Q 28 80 26 90" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <path d="M 50 42 Q 78 28 86 36" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
