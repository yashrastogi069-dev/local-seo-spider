<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <defs>
    <linearGradient id="evidBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="500" height="280" rx="14" fill="url(#evidBg)" stroke="#334155" stroke-width="1.5" />
  
  <!-- Flow: Documents -> Chunks -> Grounded Claims -->
  <g transform="translate(30, 40)">
    <!-- Column 1: Sources -->
    <rect width="110" height="190" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="14" y="26" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">SOURCES</text>
    <rect x="10" y="40" width="90" height="36" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="16" y="58" fill="#e2e8f0" font-family="sans-serif" font-size="10">HTML Documents</text>
    <rect x="10" y="85" width="90" height="36" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="16" y="103" fill="#e2e8f0" font-family="sans-serif" font-size="10">JSON / APIs</text>
    <rect x="10" y="130" width="90" height="36" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="16" y="148" fill="#e2e8f0" font-family="sans-serif" font-size="10">PDF &amp; Schema</text>
  </g>

  <!-- Connectors -->
  <line x1="140" y1="135" x2="180" y2="135" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="3,3" />

  <g transform="translate(180, 40)">
    <!-- Column 2: Chunking & Metadata -->
    <rect width="130" height="190" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="14" y="26" fill="#818cf8" font-family="monospace" font-size="11" font-weight="bold">METADATA</text>
    <rect x="10" y="40" width="110" height="28" rx="4" fill="#0f172a" />
    <text x="14" y="58" fill="#cbd5e1" font-family="sans-serif" font-size="10">canonical_url</text>
    <rect x="10" y="75" width="110" height="28" rx="4" fill="#0f172a" />
    <text x="14" y="93" fill="#cbd5e1" font-family="sans-serif" font-size="10">heading_path</text>
    <rect x="10" y="110" width="110" height="28" rx="4" fill="#0f172a" />
    <text x="14" y="128" fill="#cbd5e1" font-family="sans-serif" font-size="10">source_type</text>
    <rect x="10" y="145" width="110" height="28" rx="4" fill="#0f172a" />
    <text x="14" y="163" fill="#cbd5e1" font-family="sans-serif" font-size="10">content_hash</text>
  </g>

  <!-- Connectors -->
  <line x1="310" y1="135" x2="350" y2="135" stroke="#818cf8" stroke-width="2" stroke-dasharray="3,3" />

  <g transform="translate(350, 40)">
    <!-- Column 3: Verification & Grounding -->
    <rect width="120" height="190" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <text x="12" y="26" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">VERIFICATION</text>
    <circle cx="26" cy="60" r="10" fill="#059669" />
    <text x="22" y="64" fill="#ffffff" font-weight="bold" font-size="12">✓</text>
    <text x="44" y="64" fill="#e2e8f0" font-family="sans-serif" font-size="10">Entailment</text>
    <circle cx="26" cy="100" r="10" fill="#059669" />
    <text x="22" y="104" fill="#ffffff" font-weight="bold" font-size="12">✓</text>
    <text x="44" y="104" fill="#e2e8f0" font-family="sans-serif" font-size="10">PASS Verdict</text>
    <circle cx="26" cy="140" r="10" fill="#059669" />
    <text x="22" y="144" fill="#ffffff" font-weight="bold" font-size="12">✓</text>
    <text x="44" y="144" fill="#e2e8f0" font-family="sans-serif" font-size="10">Citations [1]</text>
  </g>
</svg>
