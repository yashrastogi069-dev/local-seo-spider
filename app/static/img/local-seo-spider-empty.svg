<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="emptyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="12" fill="url(#emptyBg)" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4" />
  
  <!-- Ledger Document Outline -->
  <g transform="translate(140, 40)">
    <rect width="120" height="130" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <!-- Lines of placeholder text -->
    <line x1="20" y1="30" x2="100" y2="30" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <line x1="20" y1="50" x2="85" y2="50" stroke="#475569" stroke-width="2" stroke-linecap="round" />
    <line x1="20" y1="65" x2="95" y2="65" stroke="#475569" stroke-width="2" stroke-linecap="round" />
    <line x1="20" y1="80" x2="70" y2="80" stroke="#475569" stroke-width="2" stroke-linecap="round" />
    <!-- Waiting radar circle -->
    <circle cx="60" cy="105" r="14" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="2,2" />
    <circle cx="60" cy="105" r="3" fill="#38bdf8" />
  </g>
  <text x="200" y="195" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Awaiting Initial Inspection Run</text>
  <text x="200" y="215" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">Local SQLite database initialized and ready</text>
</svg>
