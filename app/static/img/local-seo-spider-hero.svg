<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  <!-- Background panel -->
  <rect width="600" height="320" rx="16" fill="url(#heroBg)" stroke="#334155" stroke-width="1.5" />
  
  <!-- Grid background lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.6">
    <line x1="40" y1="40" x2="560" y2="40" />
    <line x1="40" y1="100" x2="560" y2="100" />
    <line x1="40" y1="160" x2="560" y2="160" />
    <line x1="40" y1="220" x2="560" y2="220" />
    <line x1="40" y1="280" x2="560" y2="280" />
    <line x1="120" y1="20" x2="120" y2="300" />
    <line x1="240" y1="20" x2="240" y2="300" />
    <line x1="360" y1="20" x2="360" y2="300" />
    <line x1="480" y1="20" x2="480" y2="300" />
  </g>

  <!-- Node 1: Start Seed & Canonicalizer -->
  <g transform="translate(50, 60)">
    <rect width="130" height="80" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="14" y="26" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">SEED URL</text>
    <text x="14" y="44" fill="#94a3b8" font-family="sans-serif" font-size="10">Host Gated Scope</text>
    <rect x="14" y="54" width="70" height="16" rx="4" fill="#0369a1" opacity="0.3" />
    <text x="20" y="66" fill="#7dd3fc" font-family="sans-serif" font-size="9">Canonicalized</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 180 100 L 230 100" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="4,3" />
  <polygon points="230,96 238,100 230,104" fill="#0ea5e9" />

  <!-- Node 2: Crawler Engine & Playwright -->
  <g transform="translate(240, 45)">
    <rect width="140" height="110" rx="10" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="2" />
    <text x="14" y="26" fill="#a5b4fc" font-family="monospace" font-size="11" font-weight="bold">CRAWL ENGINE</text>
    <text x="14" y="46" fill="#94a3b8" font-family="sans-serif" font-size="10">HTML + JSON + PDF</text>
    <text x="14" y="64" fill="#94a3b8" font-family="sans-serif" font-size="10">Playwright Chromium</text>
    <rect x="14" y="78" width="85" height="18" rx="4" fill="#4338ca" opacity="0.4" />
    <text x="20" y="91" fill="#c7d2fe" font-family="sans-serif" font-size="9">Deduplication</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 380 100 L 430 100" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="4,3" />
  <polygon points="430,96 438,100 430,104" fill="#6366f1" />

  <!-- Node 3: Grounded Evidence Index -->
  <g transform="translate(440, 60)">
    <rect width="120" height="80" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5" />
    <text x="12" y="26" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">EVIDENCE INDEX</text>
    <text x="12" y="44" fill="#94a3b8" font-family="sans-serif" font-size="10">FTS5 BM25 Lexical</text>
    <text x="12" y="60" fill="#94a3b8" font-family="sans-serif" font-size="10">Vector Embeddings</text>
  </g>

  <!-- Lower summary strip: Local Pipeline Status -->
  <g transform="translate(50, 190)">
    <rect width="510" height="90" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="30" cy="30" r="6" fill="#22c55e" />
    <text x="46" y="34" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">Local-First Architecture · Zero Cloud Leakage</text>
    <text x="46" y="56" fill="#94a3b8" font-family="sans-serif" font-size="11">Claim-Level Grounding · Entailment Citation Verification · Calibrated RRF Reranking</text>
    <text x="46" y="74" fill="#64748b" font-family="sans-serif" font-size="10">100% Loopback: 127.0.0.1:3000 · Self-Contained SQLite Storage · Windows Native</text>
  </g>
</svg>
