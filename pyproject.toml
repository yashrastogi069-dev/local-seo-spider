[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[project]
name = "local-seo-spider"
version = "0.1.0"
description = "A local-first, permission-gated technical SEO crawler."
requires-python = ">=3.12,<3.13"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "lxml>=5.3,<6",
  "jinja2>=3.1,<4",
  "playwright>=1.49,<2",
  "pydantic>=2.7,<3",
  "pypdf>=6.0,<7",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.12,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
]
semantic = [
  "sentence-transformers>=5,<6",
]

[project.scripts]
seo-spider = "app.main:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["app"]
